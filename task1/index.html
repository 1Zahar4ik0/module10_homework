<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена иконки</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f5f8;
        }

        button {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border: 0;
            border-radius: 6px;
            background-color: #2f80ed;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1768cf;
        }

        .button-icon {
            width: 24px;
            height: 24px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <button id="icon-button" type="button">
        <img id="icon-01" class="button-icon" src="icon_01.svg" alt="">
        <img id="icon-02" class="button-icon hidden" src="icon_02.svg" alt="">

        Сменить иконку
    </button>

    <script>
        const button = document.querySelector('#icon-button');
        const icon01 = document.querySelector('#icon-01');
        const icon02 = document.querySelector('#icon-02');

        button.addEventListener('click', function () {
            icon01.classList.toggle('hidden');
            icon02.classList.toggle('hidden');
        });
    </script>
</body>
</html>
