<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Размер экрана</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f5f8;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 6px;
            background-color: #2f80ed;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1768cf;
        }
    </style>
</head>
<body>
    <button id="screen-size-button" type="button">Размер экрана</button>

    <script>
        const button = document.querySelector('#screen-size-button');

        button.addEventListener('click', function () {
            alert(
                'Ширина экрана: ' + window.screen.width + ' px\n' +
                'Высота экрана: ' + window.screen.height + ' px'
            );
        });
    </script>
</body>
</html>
