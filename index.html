<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простой чат на основе эхо-сервера WebSocket">
    <title>Эхо-чат</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f80ed'/%3E%3Cpath d='M7 8h18v12H14l-5 5v-5H7z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="chat">
        <h1>Эхо-чат</h1>

        <div class="controls">
            <label class="visually-hidden" for="message-input">Текст сообщения</label>
            <input id="message-input" type="text" placeholder="Введите сообщение" autocomplete="off">
            <button id="send-button" type="button" disabled>Отправить</button>
            <button id="location-button" type="button" disabled>Геолокация</button>
        </div>

        <p id="status">Подключение к серверу...</p>
        <div id="messages" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
